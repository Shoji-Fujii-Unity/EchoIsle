<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>残響島：潮鎖の解錠</title>
<style>
:root{
  --bg:#03060a;
  --panel:#07111b;
  --panel2:#0d1d2a;
  --border:#24425d;
  --text:#d8e8f3;
  --muted:#89b0c8;
  --accent:#ffd86a;
  --accent2:#7ec8ff;
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
  overflow:hidden;
  touch-action:manipulation;
}
#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#010305;
}
#game{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--panel);
  border:1px solid #173046;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 0 45px rgba(0,0,0,.85);
}
header{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  padding:6px 8px;
  background:#0b1926;
  border-bottom:1px solid var(--border);
  min-height:42px;
}
#titleBox{
  display:flex;
  flex-direction:column;
  min-width:0;
  flex:1;
}
#uiTitle{
  font-weight:800;
  font-size:clamp(13px,2vw,19px);
  color:#eef6ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#uiSub{
  font-size:clamp(9px,1.2vw,12px);
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.toolbar{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
button{
  font:inherit;
  color:#e6f3ff;
  background:#163047;
  border:1px solid #396184;
  border-radius:8px;
  padding:6px 7px;
  cursor:pointer;
  font-size:clamp(9px,1.3vw,13px);
  line-height:1.1;
}
button:hover{background:#1d405f}
button:active{transform:translateY(1px)}
#sceneWrap{
  position:relative;
  background:#000;
  overflow:hidden;
}
#scene{
  width:100%;
  height:100%;
  display:block;
}
.hotspot{cursor:pointer}
.hotspot:hover{
  filter:drop-shadow(0 0 7px rgba(255,239,140,.85)) brightness(1.14);
}
.hit{
  fill:#000;
  fill-opacity:0;
  pointer-events:all;
}
footer{
  display:grid;
  grid-template-columns:1fr;
  background:#0a1722;
  border-top:1px solid var(--border);
}
#inventory{
  display:flex;
  gap:6px;
  padding:6px;
  overflow-x:auto;
  min-height:70px;
  align-items:flex-start;
  scrollbar-color:#396184 #0b1926;
}
.invbtn{
  min-width:74px;
  max-width:92px;
  height:64px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  background:#102335;
  border:1px solid #2b4d6a;
}
.invbtn svg{
  width:34px;
  height:34px;
}
.invbtn .nm{
  font-size:10px;
  color:#cfe2ef;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
  line-height:1.1;
}
#message{
  padding:8px 10px;
  min-height:40px;
  text-align:center;
  font-size:clamp(11px,1.6vw,16px);
  line-height:1.25;
  color:#f0f7ff;
  background:#081521;
  white-space:pre-wrap;
  word-break:break-word;
}
#modal{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(2,6,10,.86);
  z-index:20;
  padding:10px;
}
#modal.open{display:flex}
.modalcard{
  width:min(94%,780px);
  max-height:92%;
  overflow:auto;
  background:var(--panel2);
  border:1px solid #356184;
  border-radius:12px;
  padding:14px;
}
.modalcard h2{
  margin:0 0 10px;
  font-size:clamp(17px,3vw,26px);
  color:var(--accent);
}
.modalbody{
  font-size:clamp(12px,1.8vw,17px);
  line-height:1.5;
  white-space:pre-wrap;
}
.primary{
  margin-top:12px;
  background:#245b86;
}
@media (max-width:700px){
  header{gap:4px}
  .toolbar{gap:2px}
  button{padding:4px 4px}
  #inventory{min-height:62px}
  .invbtn{min-width:62px;height:58px}
}
</style>
</head>
<body>
<div id="stage">
  <div id="game">
    <header>
      <div id="titleBox">
        <div id="uiTitle"></div>
        <div id="uiSub"></div>
      </div>
      <div class="toolbar">
        <button id="btnLang"></button>
        <button id="btnSound"></button>
        <button id="btnSave"></button>
        <button id="btnLoad"></button>
        <button id="btnMenu"></button>
        <button id="btnFull"></button>
      </div>
    </header>

    <div id="sceneWrap">
      <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <footer>
      <div id="inventory"></div>
      <div id="message"></div>
    </footer>

    <div id="modal"></div>
  </div>
</div>

let audioCtx = null;

function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function getNested(obj, path){
  return path.split(".").reduce((o,k)=>o ? o[k] : undefined, obj);
}

function t(key, params={}){
  let s = getNested(TEXTS[S.lang], key);
  if (s === undefined) s = getNested(TEXTS[S.lang === "ja" ? "en" : "ja"], key);
  if (typeof s !== "string") return key;
  for (const [k,v] of Object.entries(params)) {
    s = s.split("{" + k + "}").join(String(v));
  }
  return s;
}

function itemName(id){ return t("items." + id); }

function say(key, params={}){
  messageEl.textContent = t(key, params);
}

function saveSettings(){
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({lang:S.lang, sound:S.sound}));
  } catch(e){}
}

function loadSettings(){
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.lang) S.lang = d.lang;
    if (typeof d.sound === "boolean") S.sound = d.sound;
  } catch(e){}
}

function saveQuiet(){
  if (S.scene !== "title") {
    try {
      const payload = {
        scene:S.scene,
        inv:S.inv,
        flags:S.flags,
        lang:S.lang,
        sound:S.sound
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    } catch(e){}
  }
  saveSettings();
}

function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    S = {
      scene: d.scene || "title",
      inv: Array.isArray(d.inv) ? d.inv : [],
      flags: Object.assign(defaultFlags(), d.flags || {}),
      lang: d.lang || S.lang,
      sound: typeof d.sound === "boolean" ? d.sound : S.sound
    };
    saveSettings();
    return true;
  } catch(e){
    return false;
  }
}

function saveExists(){
  try {
    return !!localStorage.getItem(SAVE_KEY);
  } catch(e){
    return false;
  }
}

function startNew(){
  const lang = S.lang;
  const sound = S.sound;
  S = {
    scene:"shore",
    inv:[],
    flags:defaultFlags(),
    lang,
    sound
  };
  saveQuiet();
  render();
  showModal(t("ui.gameTitle"), t("story.intro"), t("ui.ok"));
}

function showModal(title, body, buttonLabel){
  modalEl.innerHTML =
    '<div class="modalcard"><h2>' + esc(title) + '</h2>' +
    '<div class="modalbody">' + esc(body).replace(/\n/g,"<br>") + '</div>' +
    '<button class="primary" id="modalOk">' + esc(buttonLabel) + '</button></div>';
  modalEl.classList.add("open");
  const btn = document.getElementById("modalOk");
  if (btn) {
    btn.addEventListener("click", () => {
      modalEl.classList.remove("open");
      modalEl.innerHTML = "";
    });
  }
}

function hasItem(id){
  return S.inv.includes(id);
}

function removeItem(id){
  S.inv = S.inv.filter(x => x !== id);
}

function addItemRaw(id){
  if (hasItem(id)) return false;
  S.inv.push(id);
  playSound("pickup");
  tryCombine();
  return true;
}

function tryCombine(){
  if (hasItem("crystalLens") && hasItem("prismShard") && !hasItem("tideLens")) {
    removeItem("crystalLens");
    removeItem("prismShard");
    S.inv.push("tideLens");
    playSound("success");
    say("msg.combine");
  }
}

function commit(){
  saveQuiet();
  render();
}

function ensureAudio(){
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch(e){
      audioCtx = null;
    }
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(()=>{});
  }
}

function tone(freq, offset=0, dur=0.12, type="square", vol=0.05){
  if (!S.sound || !audioCtx) return;
  const now = audioCtx.currentTime + offset;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.05);
}

function playSound(kind){
  if (!S.sound) return;
  ensureAudio();
  if (!audioCtx) return;

  switch(kind){
    case "click":
      tone(430,0,.045,"triangle",.025);
      break;
    case "pickup":
      tone(560,0,.07,"square",.035);
      tone(820,.07,.07,"square",.025);
      break;
    case "unlock":
      tone(260,0,.10,"sawtooth",.045);
      tone(480,.10,.10,"sawtooth",.035);
      tone(880,.20,.12,"triangle",.03);
      break;
    case "door":
      tone(180,0,.14,"sawtooth",.035);
      tone(130,.14,.16,"sawtooth",.03);
      break;
    case "success":
      tone(523,0,.09,"triangle",.04);
      tone(659,.09,.09,"triangle",.04);
      tone(784,.18,.12,"triangle",.035);
      break;
    case "win":
      tone(523,0,.18,"triangle",.05);
      tone(659,.18,.18,"triangle",.05);
      tone(784,.36,.22,"triangle",.05);
      tone(1046,.58,.45,"triangle",.045);
      break;
    default:
      tone(400,0,.04,"square",.02);
      break;
  }
}

    <path d="M1310,570 L1450,570 L1470,870 L1290,870 Z" fill="#152029"/>
    <path d="M1330,610 L1440,610 L1455,840 L1315,840 Z" fill="#05070a"/>
    <text x="1380" y="545" text-anchor="middle" fill="#6d8390" font-size="22">Open</text>
  ` : `
    <path d="M1310,570 L1450,570 L1470,870 L1290,870 Z" fill="#3f454d"/>
    <path d="M1330,610 L1440,610 L1455,840 L1315,840 Z" fill="#2c3138"/>
    <path d="M1370,720 q25,-28 50,0 q-25,28 -50,0" fill="#74d3ef"/>
    <text x="1380" y="910" text-anchor="middle" fill="#8497a2" font-size="20">Ruins</text>
  `)}

  ${nav("lagoon_cave", 90, 450, "left")}
  `;
}

    <path d="M430,700 L640,700 L610,780 L460,780 Z" fill="#494d42"/>
    <ellipse cx="535" cy="712" rx="78" ry="14" fill="#5e6255"/>
  `)}

  ${f.runesSolved ? `
    <path d="M1360,360 L1500,360 L1520,700 L1340,700 Z" fill="#152029"/>
    <path d="M1380,410 L1490,410 L1500,670 L1370,670 Z" fill="#05070a"/>
    <text x="1430" y="335" text-anchor="middle" fill="#74e7ff" font-size="22">Open</text>
  ` : `
    <rect x="1360" y="360" width="150" height="330" fill="#41484f" stroke="#68727c" stroke-width="4"/>
    <circle cx="1435" cy="520" r="32" fill="none" stroke="#8ce6ff" stroke-width="6" opacity=".55"/>
    <path d="M1405,520 h60" stroke="#8ce6ff" stroke-width="6" opacity=".55"/>
  `}

  ${nav("ruins_lagoon", 90, 450, "left")}
  ${nav("ruins_lighthouse", 1525, 250, "right")}
  `;
}

function sceneLighthouse(){
  const f = S.flags;
  const canWin = f.lockA && f.lockB && f.lensSet;
  return `
  <defs>
    <linearGradient id="lhBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b12"/><stop offset="1" stop-color="#162435"/>
    </linearGradient>
    <radialGradient id="lhGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0a8" stop-opacity=".85"/><stop offset="1" stop-color="#fff0a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#lhBack)"/>
  <circle cx="800" cy="220" r="170" fill="url(#lhGlow)" opacity="${f.win ? 1 : 0.22}"/>

  <rect x="170" y="210" width="1260" height="520" rx="22" fill="#1d2c3a" stroke="#3d5d76" stroke-width="6"/>
  <path d="M170,260 H1430 M170,310 H1430" stroke="#2c475b" stroke-width="5"/>

  ${f.lockA ? `
    <circle cx="420" cy="470" r="34" fill="#6fc3df"/>

  ` : H("lh_keyA", `

    <path d="M392,470 q28,-28 56,0" fill="none" stroke="#6fc3df" stroke-width="5"/>
    <path d="M392,470 q28,28 56,0" fill="none" stroke="#6fc3df" stroke-width="5"/>

  ${f.lockB ? `
    <circle cx="760" cy="470" r="34" fill="#d7b3a0"/>
    <circle cx="760" cy="470" r="16" fill="#fff7ea"/>
  ` : H("lh_keyB", `
    <circle cx="760" cy="470" r="34" fill="#0b1620" stroke="#d7b3a0" stroke-width="5"/>
    <circle cx="760" cy="470" r="12" fill="none" stroke="#d7b3a0" stroke-width="4"/>
    <text x="760" y="570" text-anchor="middle" fill="#d7b3a0" font-size="20">Pearl Key</text>
  `)}

  ${f.lensSet ? `
    <circle cx="1080" cy="470" r="74" fill="#7ef0ff" opacity=".35"/>
    <circle cx="1080" cy="470" r="52" fill="#7ef0ff" opacity=".8"/>
    <path d="M1035,450 L1125,450 L1080,520 Z" fill="#ff8a8a"/>
  ` : H("lh_lens", `
    <circle cx="1080" cy="470" r="74" fill="none" stroke="#8ce6ff" stroke-width="6"/>
    <circle cx="1080" cy="470" r="42" fill="none" stroke="#8ce6ff" stroke-width="3" stroke-dasharray="10 8"/>

  ${f.win ? `
    <path d="M690,700 L910,700 L910,735 L690,735 Z" fill="#2d6b4e"/>
    <path d="M785,590 L835,590 L825,720 L795,720 Z" fill="#73c78d"/>
    <circle cx="810" cy="590" r="34" fill="#9be7ae"/>
  ` : H("lh_activate", `
    <rect x="690" y="700" width="220" height="35" rx="6" fill="${canWin ? "#8a6b2e" : "#2c3a4a"}"/>
    <path d="M795,590 L825,590 L815,720 L805,720 Z" fill="${canWin ? "#ffd86a" : "#4a6376"}"/>
    <circle cx="810" cy="590" r="34" fill="${canWin ? "#ffe58a" : "#6a8699"}" stroke="${canWin ? "#fff" : "#30404e"}" stroke-width="5"/>
    <text x="800" y="790" text-anchor="middle" fill="#d7e4f0" font-size="22">Beacon Lever</text>
  `)}

  ${nav("lh_ruins", 105, 450, "left")}

const SCENES = {
  title: sceneTitle,
  shore: sceneShore,
  jungle: sceneJungle,
  cave: sceneCave,
  lagoon: sceneLagoon,
  ruins: sceneRuins,
  lighthouse: sceneLighthouse
};

function tryGo(to){
  if (to === "cave" && !hasItem("lantern")) {
    say("msg.caveDarkShore");
    return false;
  }
  if (to === "lagoon" && !S.flags.pulledLever) {
    say("msg.lagoonBlocked");
    return false;
  }
  if (to === "ruins" && !S.flags.openedRuins) {
    say("msg.ruinsLocked");
    return false;
  }
  if (to === "lighthouse" && !S.flags.runesSolved) {
    say("msg.lighthouseLocked");
    return false;
  }
  S.scene = to;
  playSound("door");
  commit();
  return true;
}

function rotateRune(index){
  if (S.flags.runesSolved) {
    say("msg.runeSolvedDone");
    return;
  }
  const key = "r" + index;
  S.flags[key] = ((Number(S.flags[key]) || 0) + 1) % 2;
  playSound("click");
  if (Number(S.flags.r1) === 1 && Number(S.flags.r2) === 1 && Number(S.flags.r3) === 0) {
    S.flags.runesSolved = true;
    playSound("unlock");
    say("msg.runeSolved");
  } else {
    say("msg.runeClick");
  }
  commit();
}

const actions = {
  title_start(){ startNew(); },
  title_continue(){
    if (load()) {
      say("msg.loaded");
      render();
    } else {
      say("msg.noSave");
    }
  },

  shore_shell(){
    if (S.flags.gotShell) return say("msg.tidepoolEmpty");
    S.flags.gotShell = true;
    addItemRaw("shellShard");
    say("msg.pickup", {item:itemName("shellShard")});
    commit();
  },
  shore_net(){
    if (S.flags.cutNet) return say("msg.netDone");
    if (!hasItem("shellShard")) return say("msg.netNeed");
    S.flags.cutNet = true;
    addItemRaw("smallKey");
    S.flags.gotSmallKey = true;
    playSound("unlock");
    say("msg.netCut");
    commit();
  },
  shore_chest(){
    if (S.flags.openedChest) return say("msg.chestDone");
    if (!hasItem("smallKey")) return say("msg.chestNeed");
    S.flags.openedChest = true;
    addItemRaw("lantern");
    playSound("unlock");
    say("msg.chestOpen");
    commit();
  },
  shore_bottle(){
    if (S.flags.gotBottle) return say("msg.examine");
    S.flags.gotBottle = true;
    addItemRaw("bottleMap");
    say("msg.bottle");
    commit();
  },
  shore_boat(){ playSound("click"); say("msg.boat"); },
  shore_drift(){ playSound("click"); say("msg.drift"); },
  shore_cave(){
    if (!hasItem("lantern")) return say("msg.caveDarkShore");
    tryGo("cave");
  },
  shore_jungle(){ tryGo("jungle"); },

  jungle_vine(){
    if (S.flags.gotRope) return say("msg.vineDone");
    if (!hasItem("shellShard")) return say("msg.vineNeed");
    S.flags.gotRope = true;
    addItemRaw("rope");
    playSound("unlock");
    say("msg.vineCut");
    commit();
  },
  jungle_pack(){
    if (S.flags.gotGoggles) return say("msg.packDone");
    if (!hasItem("shellShard")) return say("msg.packNeed");
    S.flags.gotGoggles = true;
    addItemRaw("goggles");
    playSound("unlock");
    say("msg.packCut");
    commit();
  },
  jungle_shrine(){ playSound("click"); say("msg.shrine"); },
  jungle_camp(){ playSound("click"); say("msg.camp"); },
  jungle_cave(){
    if (!hasItem("lantern")) return say("msg.caveDarkShore");
    tryGo("cave");
  },
  jungle_shore(){ tryGo("shore"); },

  cave_dark(){
    if (!hasItem("lantern")) say("msg.caveDarkMsg");
  },
  cave_shore(){ tryGo("shore"); },
  cave_crystal(){
    if (S.flags.gotCrystal) return say("msg.crystalTaken");
    S.flags.gotCrystal = true;
    addItemRaw("crystalLens");
    say("msg.pickup", {item:itemName("crystalLens")});
    commit();
  },
  cave_lever(){
    if (S.flags.pulledLever) return say("msg.leverDone");
    if (!hasItem("rope")) return say("msg.leverNeed");
    S.flags.pulledLever = true;
    playSound("unlock");
    say("msg.leverPulled");
    commit();
  },
  cave_alcove(){
    if (!S.flags.pulledLever) return say("msg.alcoveHidden");
    if (S.flags.gotTideKey) return say("msg.alcoveDone");
    S.flags.gotTideKey = true;
    addItemRaw("tideKey");
    playSound("unlock");
    say("msg.alcoveOpen");
    commit();
  },
  cave_lagoon(){
    if (!S.flags.pulledLever) return say("msg.caveNoLagoon");
    tryGo("lagoon");
  },

  lagoon_reed(){
    if (S.flags.gotReed) return say("msg.reedDone");
    S.flags.gotReed = true;
    addItemRaw("reedTube");
    playSound("unlock");
    say("msg.reedPick");
    commit();
  },
  lagoon_crate(){
    if (S.flags.gotPearl) return say("msg.crateDone");
    if (!S.flags.crateExposed) {
      if (!hasItem("goggles")) return say("msg.crateGoggles");
      if (!hasItem("reedTube")) return say("msg.crateReed");
      S.flags.crateExposed = true;
      playSound("success");
      say("msg.crateDive");
      commit();
      return;
    }
    if (!hasItem("rope")) return say("msg.crateRope");
    S.flags.gotPearl = true;
    addItemRaw("pearlKey");
    playSound("unlock");
    say("msg.crateFree");
    commit();
  },
  lagoon_reef(){ playSound("click"); say("msg.reef"); },
  lagoon_ruinsDoor(){
    if (S.flags.openedRuins) {
      tryGo("ruins");
      return;
    }
    if (!hasItem("tideKey")) return say("msg.doorNeed");
    S.flags.openedRuins = true;
    playSound("unlock");
    say("msg.doorOpen");
    commit();
  },
  lagoon_cave(){ tryGo("cave"); },

  ruins_lagoon(){ tryGo("lagoon"); },
  ruins_lighthouse(){ tryGo("lighthouse"); },
  ruins_tablet(){
    if (S.flags.readRunes) {
      say("msg.tabletAgain");
      return;
    }
    if (!hasItem("bottleMap")) return say("msg.tabletNeed");
    S.flags.readRunes = true;
    playSound("success");
    say("msg.tabletClue");
    commit();
  },
  ruins_rune1(){ rotateRune(1); },
  ruins_rune2(){ rotateRune(2); },
  ruins_rune3(){ rotateRune(3); },
  ruins_altar(){
    if (S.flags.usedCrystalAltar) return say("msg.altarDone");
    if (!hasItem("crystalLens")) return say("msg.altarNeed");
    S.flags.usedCrystalAltar = true;
    playSound("success");
    say("msg.altarUsed");
    commit();
  },
  ruins_prism(){
    if (S.flags.gotPrism) return say("msg.prismDone");
    S.flags.gotPrism = true;
    const added = addItemRaw("prismShard");
    if (added && !hasItem("tideLens")) {
      say("msg.pickup", {item:itemName("prismShard")});
    }
    commit();
  },
  ruins_sarc(){ playSound("click"); say("msg.sarc"); },

  lh_ruins(){ tryGo("ruins"); },
  lh_keyA(){
    if (S.flags.lockA) return say("msg.keyADone");
    if (!hasItem("tideKey")) return say("msg.keyNeedA");
    S.flags.lockA = true;
    playSound("unlock");
    say("msg.keyA");
    commit();
  },
  lh_keyB(){
    if (S.flags.lockB) return say("msg.keyBDone");
    if (!hasItem("pearlKey")) return say("msg.keyNeedB");
    S.flags.lockB = true;
    playSound("unlock");
    say("msg.keyB");
    commit();
  },
  lh_lens(){
    if (S.flags.lensSet) return say("msg.lensSetDone");
    if (!hasItem("tideLens")) return say("msg.lensNeed");
    S.flags.lensSet = true;
    playSound("success");
    say("msg.lensDone");
    commit();
  },
  lh_activate(){
    if (S.flags.win) return say("msg.lighthouseWon");
    if (!S.flags.lockA || !S.flags.lockB || !S.flags.lensSet) {
      say("msg.activateNeed");
      return;
    }
    S.flags.win = true;
    saveQuiet();
    render();
    playSound("win");
    showModal(t("ui.gameTitle"), t("story.win"), t("ui.ok"));
  }
};

function renderInventory(){
  invEl.innerHTML = "";
  S.inv.forEach(id => {
    const b = document.createElement("button");
    b.className = "invbtn";
    b.innerHTML = itemSVG(id) + '<div class="nm">' + esc(itemName(id)) + "</div>";
    b.addEventListener("click", () => {
      ensureAudio();
      playSound("click");
      say("msg.itemInfo", {item:itemName(id)});
    });
    invEl.appendChild(b);
  });
}

function updateLabels(){
  document.title = t("ui.gameTitle");
  document.getElementById("uiTitle").textContent = t("ui.shortTitle");
  document.getElementById("uiSub").textContent = t("ui.subtitle");
  document.getElementById("btnLang").textContent = S.lang === "ja" ? "English" : "日本語";
  document.getElementById("btnSound").textContent = S.sound ? "🔊 ON" : "🔇 OFF";
  document.getElementById("btnSave").textContent = t("ui.save");
  document.getElementById("btnLoad").textContent = t("ui.load");
  document.getElementById("btnMenu").textContent = t("ui.menu");
  document.getElementById("btnFull").textContent = t("ui.full");
}

function render(){
  updateLabels();
  const fn = SCENES[S.scene] || sceneTitle;
  sceneEl.innerHTML = fn();
  renderInventory();
}

function wireHeaderButtons(){
  document.getElementById("btnLang").addEventListener("click", () => {
    S.lang = S.lang === "ja" ? "en" : "ja";
    saveQuiet();
    render();
    say(S.lang === "ja" ? "言語を日本語に切り替えました。" : "Language switched to English.");
  });

  document.getElementById("btnSound").addEventListener("click", () => {
    S.sound = !S.sound;
    if (S.sound) ensureAudio();
    saveQuiet();
    updateLabels();
    playSound("click");
  });

  document.getElementById("btnSave").addEventListener("click", () => {
    ensureAudio();
    if (S.scene === "title") {
      say("msg.noSave");
      return;
    }
    saveQuiet();
    playSound("success");
    say("msg.saved");
  });

  document.getElementById("btnLoad").addEventListener("click", () => {
    ensureAudio();
    if (load()) {
      playSound("success");
      say("msg.loaded");
      render();
    } else {
      playSound("click");
      say("msg.noSave");
    }
  });

  document.getElementById("btnMenu").addEventListener("click", () => {
    ensureAudio();
    playSound("door");
    S.scene = "title";
    render();
  });

  document.getElementById("btnFull").addEventListener("click", () => {
    ensureAudio();
    playSound("click");
    try {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    } catch(e){}
  });
}

function wireSceneEvents(){
  sceneEl.addEventListener("click", (ev) => {
    ensureAudio();
    const g = ev.target.closest("[data-id]");
    if (!g) {
      if (S.scene === "cave" && !hasItem("lantern")) say("msg.caveDarkMsg");
      return;
    }
    const id = g.dataset.id;
    playSound("click");
    if (typeof actions[id] === "function") {
      actions[id]();
    } else {
      say("msg.examine");
    }
  });
}

function init(){
  loadSettings();
  wireHeaderButtons();
  wireSceneEvents();
  render();
}

init();
</script>
</body>
</html>
